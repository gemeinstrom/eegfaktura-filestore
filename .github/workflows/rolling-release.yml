# gemeinstrom-Fork-Variante des upstream-Workflows (eegfaktura/*).
# Delta zum Upstream (bei jedem Upstream-Sync neu anwenden):
#   - Push nach ghcr.io/gemeinstrom/* statt ghcr.io/vfeeg-development/*
#   - Registry-Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-*-Jobs zum Platform-Repo in vfeeg-development entfernt, kein env/**-Trigger
# Die Kommentare unterhalb stammen aus dem Upstream und beschreiben dessen Ziel-Org.

# Ziel: ERSETZT die bestehende rolling-release.yml in eegfaktura/eegfaktura-filestore.
# Unterschied zum aktuellen Stand: zusaetzlicher Job `dispatch-deploy` am Ende,
# der das Platform-Repo (vfeeg-development/eegfaktura-platform) ueber einen
# erfolgreichen Build benachrichtigt.
#
# Vorbedingung: Repo-Secret `PLATFORM_DEPLOY_PAT` muss gesetzt sein
# (Classic PAT mit Scope `repo` auf vfeeg-development/eegfaktura-platform).

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']

env:
  REGISTRY: "ghcr.io"
  # Image landet im Development-Tier (vfeeg-development), nicht im Release-Tier
  # (eegfaktura). Siehe ADR-0005 im Platform-Repo. Repo-Name bleibt dynamisch,
  # damit das Template ohne Aenderung in andere Source-Repos uebernehmbar ist.
  IMAGE_NAME: gemeinstrom/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-filestore"
            org.opencontainers.image.description="EEG Faktura filestore service container handling the file upload and download"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.branch=${{ github.ref_type == 'branch' && github.ref || '' }}
            org.opencontainers.image.ref.tag=${{ github.ref_type == 'tag' && github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}
            org.opencontainers.image.repository.url=${{ github.event.repository.html_url || '' }}

      - name: Login to Container Registry
        # Push cross-org nach vfeeg-development/* — GITHUB_TOKEN reicht dafuer
        # nicht (scope ist auf den source-repo beschraenkt). Nutzen den Classic-PAT
        # VFEEG_DEV_PUSH_PAT (write:packages auf vfeeg-development, 90-Tage-Expiry).
        # GHCR validiert via Token, nicht via username — github.actor bleibt.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # service.version in the log identifies the BUILD: the version for a tag build, else the commit (a branch
          # name cannot tell builds apart). Prod/pilot images are re-tagged dev-tier digests (gitops promote-image.yml,
          # no rebuild), so the release version of a running image is its tag, not this value.
          build-args: |
            SERVICE_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
